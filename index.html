<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flowers For You 💜</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#24113b,#080812 70%);color:#d9a4ff;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center}.scene{position:relative;width:min(100vw,520px);height:min(100vh,850px);overflow:hidden}.title{position:absolute;top:12%;width:100%;text-align:center;font-size:clamp(2rem,8vw,3.5rem);font-style:italic;text-shadow:0 0 15px #b45aff,0 0 30px #6825b7;animation:glow 3s ease-in-out infinite alternate;z-index:2}.moon{position:absolute;right:8%;top:17%;width:50px;height:50px;border-radius:50%;background:#fff8ff;box-shadow:0 0 25px #fff}.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 15% 20%,#fff,transparent),radial-gradient(1px 1px at 75% 35%,#fff,transparent),radial-gradient(2px 2px at 80% 75%,#fff,transparent),radial-gradient(1px 1px at 30% 55%,#fff,transparent),radial-gradient(1px 1px at 60% 12%,#fff,transparent),radial-gradient(2px 2px at 9% 80%,#fff,transparent);background-size:220px 190px;animation:twinkle 4s infinite alternate}.bouquet{position:absolute;bottom:18%;left:50%;width:330px;height:420px;transform:translateX(-50%)}.stem{position:absolute;bottom:20px;left:50%;width:9px;height:260px;background:linear-gradient(90deg,#164c31,#5bb978,#17462b);border-radius:100%;transform-origin:bottom;animation:sway 4s ease-in-out infinite}.stem:nth-child(1){transform:rotate(-25deg)}.stem:nth-child(2){transform:rotate(-12deg)}.stem:nth-child(3){transform:rotate(5deg)}.stem:nth-child(4){transform:rotate(18deg)}.stem:nth-child(5){transform:rotate(30deg)}.leaf{position:absolute;width:55px;height:24px;background:linear-gradient(130deg,#68bd83,#174b2c);border-radius:100% 0 100% 0;bottom:130px;left:calc(50% - 20px);transform:rotate(-30deg)}.leaf.l2{bottom:180px;left:calc(50% + 20px);transform:rotate(45deg)}.flower{position:absolute;width:66px;height:90px;bottom:250px;left:calc(50% - 33px);animation:bloom 2s ease-out both,sway 4s ease-in-out infinite;transform-origin:bottom}.flower:nth-of-type(7){left:12%;bottom:220px;transform:rotate(-24deg)}.flower:nth-of-type(8){left:29%;bottom:280px;transform:rotate(-10deg)}.flower:nth-of-type(9){left:45%;bottom:315px}.flower:nth-of-type(10){left:61%;bottom:275px;transform:rotate(12deg)}.flower:nth-of-type(11){left:78%;bottom:225px;transform:rotate(25deg)}.flower:before,.flower:after,.flower i{content:'';position:absolute;width:36px;height:65px;border-radius:50% 50% 42% 42%;background:linear-gradient(160deg,#e3b5ff,#a44ee2 55%,#6320a8);box-shadow:inset -5px -5px 12px #64229a,0 0 12px #b86bff55;top:4px}.flower:before{left:0;transform:rotate(-22deg)}.flower:after{right:0;transform:rotate(22deg)}.flower i{left:15px;top:0;width:38px;height:72px;background:linear-gradient(160deg,#f0caff,#bd69ef 55%,#762bb5);z-index:1}.flower span{position:absolute;left:29px;top:10px;height:55px;width:3px;background:#9c4bcb;z-index:2}.wrap{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);width:190px;height:235px;perspective:900px;z-index:4}.card{position:absolute;inset:0;background:#f5d5ff;border-radius:8px;box-shadow:0 0 25px #a653df77;color:#63208e;text-align:center;padding:15px;transition:transform .8s;cursor:pointer}.card:before{content:'💜';font-size:35px;display:block;margin-top:5px}.card h2{font-size:20px;margin:8px 0}.card p{font-family:Arial,sans-serif;font-size:14px;line-height:1.5}.card .hint{font-size:11px;opacity:.65}.card.open{transform:rotateY(180deg)}.card.open .inside{transform:rotateY(180deg)}.inside{position:absolute;inset:0;border-radius:8px;background:#fff8ff;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .8s;backface-visibility:hidden}.inside h3{font-size:20px}.inside p{font-family:Arial,sans-serif;font-size:14px;line-height:1.5}.inside .heart{font-size:26px}@keyframes bloom{0%{scale:.1;opacity:0}70%{scale:1.12}100%{scale:1;opacity:1}}@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2deg}}@keyframes glow{to{text-shadow:0 0 22px #d09aff,0 0 40px #872fd3}}@keyframes twinkle{to{opacity:.65}}
</style></head><body><main class="scene"><div class="stars"></div><div class="moon"></div><h1 class="title">Flowers For You</h1><div class="bouquet"><div class="stem"></div><div class="stem"></div><div class="stem"></div><div class="stem"></div><div class="stem"></div><div class="leaf"></div><div class="leaf l2"></div><div class="flower"><i></i></div><div class="flower"><i></i></div><div class="flower"><i></i></div><div class="flower"><i></i></div><div class="flower"><i></i></div></div><div class="wrap" onclick="this.querySelector('.card').classList.toggle('open')"><div class="card"><h2>A little gift</h2><p>Tap this card to open it.</p><p class="hint">A bouquet just for you</p><div class="inside"><h3>For my friend 💜</h3><p>May these flowers remind you that you deserve kindness, joy, and lovely little moments.</p><div class="heart">💜</div></div></div></div></main></body></html>
